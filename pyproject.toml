[project]
name = "real-estate-whatsapp-agent"
version = "1.0.0"
description = "Automated WhatsApp outreach, qualification and handoff for US real estate"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends()/Query() in defaults is idiomatic
